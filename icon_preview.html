<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>YouTube Dual Subtitles - 擴充功能圖示預覽 (Icon Preview)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 36px;
    }
    .preview-container {
      display: flex;
      gap: 32px;
      align-items: flex-end;
      background: #1a1a1a;
      padding: 36px 48px;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      margin-bottom: 40px;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .icon-card .label {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
    }
    /* SVG Icon Render */
    .app-icon {
      border-radius: 22%;
      box-shadow: 0 8px 24px rgba(255, 0, 51, 0.25);
      transition: transform 0.2s ease;
    }
    .app-icon:hover {
      transform: scale(1.06);
    }
    .toolbar-mockup {
      width: 100%;
      max-width: 580px;
      background: #202124;
      border-radius: 10px;
      border: 1px solid #3c4043;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .address-bar {
      flex: 1;
      background: #303134;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      color: #9aa0a6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .extension-slot {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-live {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #22c55e;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>🎬 YouTube Dual Subtitles 圖示預覽</h1>
  <p class="subtitle">針對 Chrome 工具列 (16px/48px) 與 Chrome 商店展示 (128px/256px) 最佳化</p>

  <div class="preview-container">
    <!-- 256px (Store Showcase) -->
    <div class="icon-card">
      <svg class="app-icon" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ytRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF1A4B" />
            <stop offset="100%" stop-color="#D9002C" />
          </linearGradient>
          <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
          </filter>
        </defs>
        <!-- Background Rounded Box -->
        <rect width="200" height="200" rx="46" fill="url(#ytRedGrad)"/>
        
        <!-- Top Subtitle Line (White - Original Lang) -->
        <rect x="42" y="62" width="116" height="24" rx="7" fill="#FFFFFF" filter="url(#subtleGlow)"/>
        
        <!-- Bottom Subtitle Line (Vibrant Gold - Translation Lang) -->
        <rect x="42" y="104" width="86" height="24" rx="7" fill="#FFE600" filter="url(#subtleGlow)"/>

        <!-- Language Translation Glyph (Tiny Globe / Sparkle Accent) -->
        <circle cx="152" cy="116" r="6" fill="#FFE600" opacity="0.9"/>
      </svg>
      <span class="label">256px (商店展示 / 高解析)</span>
    </div>

    <!-- 128px (Web Store Standard) -->
    <div class="icon-card">
      <svg class="app-icon" width="100" height="100" viewBox="0 0 200 200">
        <use href="#ytRedGrad" />
        <rect width="200" height="200" rx="46" fill="url(#ytRedGrad)"/>
        <rect x="42" y="62" width="116" height="24" rx="7" fill="#FFFFFF"/>
        <rect x="42" y="104" width="86" height="24" rx="7" fill="#FFE600"/>
        <circle cx="152" cy="116" r="6" fill="#FFE600"/>
      </svg>
      <span class="label">128px (Chrome 商店)</span>
    </div>

    <!-- 48px (Extensions Management) -->
    <div class="icon-card">
      <svg class="app-icon" width="48" height="48" viewBox="0 0 200 200">
        <rect width="200" height="200" rx="46" fill="url(#ytRedGrad)"/>
        <rect x="42" y="62" width="116" height="24" rx="7" fill="#FFFFFF"/>
        <rect x="42" y="104" width="86" height="24" rx="7" fill="#FFE600"/>
        <circle cx="152" cy="116" r="6" fill="#FFE600"/>
      </svg>
      <span class="label">48px (擴充管理頁)</span>
    </div>

    <!-- 16px (Browser Toolbar) -->
    <div class="icon-card">
      <svg class="app-icon" width="24" height="24" viewBox="0 0 200 200">
        <rect width="200" height="200" rx="46" fill="url(#ytRedGrad)"/>
        <rect x="42" y="62" width="116" height="26" rx="8" fill="#FFFFFF"/>
        <rect x="42" y="106" width="90" height="26" rx="8" fill="#FFE600"/>
      </svg>
      <span class="label">16px (瀏覽器工具列)</span>
    </div>
  </div>

  <h3 style="font-size: 16px; margin-bottom: 12px; color: #ddd;">🖥️ Chrome 瀏覽器工具列模擬效果 (Mockup)</h3>
  <div class="toolbar-mockup">
    <span style="color: #9aa0a6; font-size: 14px;">🔒</span>
    <div class="address-bar">https://www.youtube.com/watch?v=dQw4w9WgXcQ</div>
    <div class="extension-slot">
      <!-- 16px Toolbar Icon -->
      <svg class="app-icon" width="20" height="20" viewBox="0 0 200 200">
        <rect width="200" height="200" rx="46" fill="#FF1A4B"/>
        <rect x="42" y="62" width="116" height="28" rx="8" fill="#FFFFFF"/>
        <rect x="42" y="106" width="90" height="28" rx="8" fill="#FFE600"/>
      </svg>
      <span class="badge-live">雙語字幕 Active</span>
    </div>
  </div>

</body>
</html>
